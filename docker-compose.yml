services:
  redis:
    image: redis:7
    container_name: bcizone-redis
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A core worker -l info
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.local
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
